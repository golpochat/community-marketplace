apiVersion: v1
kind: Namespace
metadata:
  name: cm-source-secrets
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: external-secrets-reader
  namespace: cm-source-secrets
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: external-secrets-reader
  namespace: cm-source-secrets
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: external-secrets-reader
subjects:
  - kind: ServiceAccount
    name: external-secrets-reader
    namespace: community-marketplace
  - kind: ServiceAccount
    name: staging-external-secrets-reader
    namespace: community-marketplace-staging
  - kind: ServiceAccount
    name: dev-external-secrets-reader
    namespace: community-marketplace

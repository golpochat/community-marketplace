# Reads from secrets in namespace `cm-source-secrets` (created out of band).
# Apply `infra/k8s/source-secrets/` once per cluster after installing External Secrets Operator.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: external-secrets-reader
  namespace: community-marketplace
---
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: app
  namespace: community-marketplace
spec:
  provider:
    kubernetes:
      remoteNamespace: cm-source-secrets
      server:
        url: https://kubernetes.default.svc
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
      auth:
        serviceAccount:
          name: external-secrets-reader

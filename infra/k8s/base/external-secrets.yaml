apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: api-secrets
  namespace: community-marketplace
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: app
    kind: SecretStore
  target:
    creationPolicy: Owner
  data:
    - secretKey: JWT_SECRET
      remoteRef:
        key: api
        property: JWT_SECRET
    - secretKey: DATABASE_URL
      remoteRef:
        key: api
        property: DATABASE_URL
    - secretKey: REDIS_URL
      remoteRef:
        key: api
        property: REDIS_URL
    - secretKey: STRIPE_SECRET_KEY
      remoteRef:
        key: api
        property: STRIPE_SECRET_KEY
    - secretKey: STRIPE_WEBHOOK_SECRET
      remoteRef:
        key: api
        property: STRIPE_WEBHOOK_SECRET
    - secretKey: MEILISEARCH_API_KEY
      remoteRef:
        key: api
        property: MEILISEARCH_API_KEY
    - secretKey: METRICS_SCRAPE_TOKEN
      remoteRef:
        key: api
        property: METRICS_SCRAPE_TOKEN
    - secretKey: R2_ACCOUNT_ID
      remoteRef:
        key: api
        property: R2_ACCOUNT_ID
    - secretKey: R2_ACCESS_KEY_ID
      remoteRef:
        key: api
        property: R2_ACCESS_KEY_ID
    - secretKey: R2_SECRET_ACCESS_KEY
      remoteRef:
        key: api
        property: R2_SECRET_ACCESS_KEY
    - secretKey: SENDGRID_API_KEY
      remoteRef:
        key: api
        property: SENDGRID_API_KEY
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: postgres-secrets
  namespace: community-marketplace
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: app
    kind: SecretStore
  target:
    creationPolicy: Owner
  data:
    - secretKey: POSTGRES_USER
      remoteRef:
        key: postgres
        property: POSTGRES_USER
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: postgres
        property: POSTGRES_PASSWORD
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
